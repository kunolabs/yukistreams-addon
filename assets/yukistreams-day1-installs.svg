<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="Yukistreams day one install chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061112"/>
      <stop offset="0.58" stop-color="#071817"/>
      <stop offset="1" stop-color="#030607"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d7c8"/>
      <stop offset="0.55" stop-color="#49f0b4"/>
      <stop offset="1" stop-color="#95ffcc"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38d7c8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#38d7c8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="760" rx="42" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1397" height="757" rx="40" fill="none" stroke="#153633" stroke-width="3"/>

  <text x="72" y="102" fill="#ecf7f3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Yukistreams installs</text>
  <text x="72" y="144" fill="#829892" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">FIRST PUBLIC DAY</text>

  <g transform="translate(72 194)">
    <text x="0" y="106" fill="#48f0b7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="126" font-weight="900">1,016</text>
    <text x="6" y="150" fill="#cfe7df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="750">total installs in the first 24 hours</text>
  </g>

  <g transform="translate(74 430)">
